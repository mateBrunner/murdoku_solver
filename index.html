<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murdoku Grid Finder</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 20% 20%, #5b2a86 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #0f7b9c 0%, transparent 50%),
                linear-gradient(135deg, #1a1033, #0c1e3a);
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #app { width: 100%; max-width: 1300px; display: flex; gap: 32px; align-items: center; justify-content: center; }
  #app.empty { flex-direction: column; }
  .pane { flex: 1 1 0; min-width: 0; display: none; flex-direction: column; align-items: center; gap: 14px; }
  #app.done .pane { display: flex; }
  .pane canvas { max-width: 100%; max-height: 72vh; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.45); background: #0003; }
  #src, #src2 { touch-action: none; }
  #origPane.two canvas { max-height: 34vh; }
  .btn2 { cursor: pointer; color: #fff; font-weight: 600; padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); }
  .btn2:hover { background: rgba(255,255,255,.3); }
  #app.started .btn2, #app.started #charLabel, #app.started #info { display: none; }
  .pane.side { flex: 0.6 1 0; }
  .badge { background: rgba(255,255,255,.14); backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 20px; font-size: 1.05rem; }
  .badge b { font-size: 1.25rem; }
  #info input { width: 3.6em; padding: 4px 6px; margin: 0 4px; font: inherit; font-weight: 700; text-align: center; color: #fff; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); border-radius: 8px; outline: none; }
  #info input:focus { border-color: #fff; background: rgba(255,255,255,.26); }
  .btn {
    cursor: pointer; border: 0; color: #fff; font-size: 1.15rem; font-weight: 600;
    padding: 16px 36px; border-radius: 999px;
    background: linear-gradient(135deg, #ff7a59, #e8369a);
    box-shadow: 0 10px 30px rgba(232,54,154,.45);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(232,54,154,.6); }
  #app.done .btn { padding: 10px 24px; font-size: .95rem; position: fixed; top: 16px; left: 16px; }
  .toolbox { display: none; flex: 0 0 210px; height: auto; align-self: center; flex-direction: row; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 10px; padding: 14px 8px; border-radius: 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(8px); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  #app.started .toolbox { display: flex; }
  .tool { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; background: rgba(255,255,255,.15); border: 2px solid transparent; border-radius: 10px; padding: 0; }
  .tool:hover { background: rgba(255,255,255,.28); }
  .letters { flex: 0 0 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
  .tool.letter { font-size: 1.3rem; font-weight: 700; color: var(--c); border-color: var(--c); }
  .tool.letter:hover { background: rgba(255,255,255,.28); }
  .tool.letter.active { background: var(--bg); border-color: var(--c); box-shadow: 0 0 0 3px #fff, 0 0 18px var(--c); }
  .tool.letter.active:hover { background: var(--bg); }
  .tool:disabled { opacity: .3; cursor: not-allowed; }
  .tool.active { background: rgba(255,255,255,.3); border-color: #fff; box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.7); }
  .start { display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); cursor: pointer; border: 0; color: #fff; font-size: 1.6rem; font-weight: 700; letter-spacing: .05em; padding: 18px 80px; border-radius: 999px; background: linear-gradient(135deg, #3ddc84, #1a9f55); box-shadow: 0 10px 30px rgba(61,220,132,.5); }
  .start:hover { filter: brightness(1.1); }
  #app.done.step1 ~ #next, #app.done.step2:not(.started) ~ #start, #app.done.step2:not(.started) ~ #back { display: block; }
  #app.done.step1 .pane.side, #app.done.step1 #src2 { display: none; }
  #app.done.step1 #origPane.two canvas { max-height: 72vh; }
  #app.done.step2:not(.started) #gridPane { display: none; }
  .back { display: none; position: fixed; bottom: 36px; left: 24px; }
  #app.started #origPane { display: none; }
  #app.started { max-width: none; gap: 20px; }
  #app.started .pane canvas { max-width: none; max-height: none; }
  #app.started .pane.side { flex: 1 1 0; }
  #msg { position: fixed; bottom: 100px; left: 0; right: 0; text-align: center; opacity: .85; }
  input[type=file] { display: none; }
  /* Mobile layout */
  #crop { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  @media (max-width: 800px) {
    body { padding: 10px 10px 120px; align-items: flex-start; }
    #app { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 14px; }
    #app.empty { align-items: center; justify-content: center; min-height: calc(100dvh - 130px); }
    .pane, .pane.side { flex: 0 0 auto; }
    .pane canvas { max-height: 30vh; }
    #app.done .btn { position: static; order: 0; align-self: center; padding: 10px 24px; font-size: .95rem; }
    #app.done.step2:not(.started) #origPane { order: 1; }
    #app.done.step2:not(.started) .pane.side { order: 2; }
    .badge { font-size: .9rem; padding: 8px 16px; border-radius: 18px; text-align: center; }
    .start { font-size: 1.3rem; padding: 14px 56px; bottom: 16px; }
    .back { bottom: auto; top: 12px; left: auto; right: 12px; }
    #app.done.step2:not(.started), #app.done.step1 { padding-bottom: 90px; }
    #msg { bottom: 80px; padding: 0 12px; }

    /* After Start: grid on top, buttons below it, characters below (the only scrollable part). */
    body:has(#app.started) { padding: 8px; height: 100dvh; overflow: hidden; }
    #app.started { height: calc(100dvh - 16px); overflow: hidden; gap: 8px; max-width: none; }
    #app.started .btn { order: 99; padding: 8px 20px; font-size: .85rem; }
    #app.started #gridPane { order: 1; flex: 0 0 auto; }
    #app.started .toolbox { order: 2; flex: 0 0 auto; width: 100%; padding: 8px; gap: 8px; align-self: stretch; flex-wrap: wrap; align-items: flex-start; justify-content: flex-start; gap: 6px; }
    #app.started .tool { width: 33px; height: 33px; border-radius: 8px; flex: 0 0 auto; }
    #app.started .tool svg { width: 15px; height: 15px; }
    #app.started .tool.letter { font-size: .9rem; }
    #app.started .letters { display: contents; }
    #app.started .letters .tool:first-child { margin-left: 12px; }
    #app.started .pane.side { order: 3; flex: 1 1 0; min-height: 0; overflow-y: auto; justify-content: flex-start; -webkit-overflow-scrolling: touch; }
    #app.started .pane.side canvas { flex: 0 0 auto; }
  }
</style>
</head>
<body>
<div id="app" class="empty step1">
  <label class="btn" id="upload">Start new game<input type="file" id="file" accept="image/*,application/pdf,.pdf"></label>
  <div class="pane side"><canvas id="avatars"></canvas><div class="badge" id="charLabel">Characters</div><label class="btn2" id="charBtn">Upload characters<input type="file" id="charFile" accept="image/*,application/pdf,.pdf"></label></div>
  <div class="pane" id="origPane"><canvas id="src"></canvas><canvas id="src2" hidden></canvas><div class="badge" id="help"></div></div>
  <div class="toolbox" id="toolbox">
    <button class="tool" data-tool="eraser" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-5-5a2 2 0 0 1 0-2.8l8.2-8.2a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12 20"/><path d="M8 11l6 6"/></svg></button>
    <button class="tool" data-tool="x" title="Mark X" aria-label="Mark X"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <button class="tool action" data-tool="clear" title="Clear" aria-label="Clear"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg></button>
  <div class="letters" id="letters"></div>
  </div>
 <div class="pane" id="gridPane"><canvas id="crop"></canvas><div class="badge" id="info"><input id="rowsIn" type="number" min="1" max="40" aria-label="Rows"> rows × <input id="colsIn" type="number" min="1" max="40" aria-label="Columns"> columns</div></div>
</div>
<button class="start" id="next">Next</button>
<button class="start" id="start">Start</button>
<label class="btn2 back" id="back">Back</label>
<div id="msg"></div>

<script src="pdf.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const app = $('app'), msg = $('msg'), src = $('src'), crop = $('crop');
const sctx = src.getContext('2d'), cctx = crop.getContext('2d');
const avc = $('avatars'), actx = avc.getContext('2d');

let img = null, scale = 1, edges = null;
let av = null;            // characters crop rectangle, in pixels of charImg (or img)
let charImg = null;       // optional separately uploaded characters image
const src2 = $('src2'), s2ctx = src2.getContext('2d');
let rect = null;          // {x0,y0,x1,y1} in original image pixels
let grid = null;          // detected line positions in original image pixels
let drag = null;          // {mode, startX, startY, orig}

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  openFile(f, im => load(limit(im)));
  e.target.value = '';
});

// Opens an image or a single-page PDF (first page is rendered) and hands back an Image.
function openFile(f, ok) {
  const fail = () => { msg.textContent = 'Could not read that file.'; };
  const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  const fromUrl = url => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = fail;
    im.src = url;
  };
  if (!isPdf) return fromUrl(URL.createObjectURL(f));
  if (!window.pdfjsLib) return fail();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  f.arrayBuffer()
    .then(buf => pdfjsLib.getDocument({ data: buf }).promise)
    .then(doc => doc.getPage(1))
    .then(page => {
      const v1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(4, 2400 / Math.max(v1.width, v1.height)) });
      const cv = document.createElement('canvas');
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
      return page.render({ canvasContext: c, viewport: vp }).promise.then(() => fromUrl(cv.toDataURL('image/png')));
    })
    .catch(fail);
}

const HELP = {
  1: 'Step 1 of 2: drag the pink rectangle (or its handles) onto the grid, then check the rows and columns',
  2: 'Step 2 of 2: drag the cyan rectangle (or its handles) around the characters, or upload a characters image'
};
function setStep(n) {
  app.classList.toggle('step1', n === 1);
  app.classList.toggle('step2', n === 2);
  $('help').textContent = HELP[n];
  if (img && rect) { render(); scheduleSave(); }
}
$('next').addEventListener('click', () => {
  if (!grid) { msg.textContent = 'Set the number of rows and columns first.'; return; }
  msg.textContent = '';
  setStep(2);
});
$('back').addEventListener('click', () => setStep(1));
setStep(1);

$('start').addEventListener('click', () => {
  app.classList.add('started'); msg.textContent = '';
  view = { z: 1, ox: 0, oy: 0 };
  buildLetters(grid ? Math.min(grid.xs.length, grid.ys.length) - 1 : 0);
  render();
  fitStarted();
});

// After Start, scale the characters and grid pictures up to fill their panes (aspect ratio kept).
function fitStarted() {
  for (const cv of [avc, crop]) {
    if (!app.classList.contains('started')) { cv.style.width = cv.style.height = ''; continue; }
    const lw = cv === crop ? Math.max(1, Math.round(rect.x1 - rect.x0)) : cv.width;
    const lh = cv === crop ? Math.max(1, Math.round(rect.y1 - rect.y0)) : cv.height;
    // Mobile: the grid must fit fully on top; the characters only fit the width (their pane scrolls).
    const maxH = MOBILE.matches ? (cv === crop ? window.innerHeight * 0.5 : Infinity) : window.innerHeight * 0.92;
    const s = Math.min(cv.parentElement.clientWidth / lw, maxH / lh);
    cv.style.width = Math.floor(lw * s) + 'px';
    cv.style.height = Math.floor(lh * s) + 'px';
  }
  if (img && rect) renderCrop();
}
window.addEventListener('resize', fitStarted);

function toggleTool(b) {
  const was = b.classList.contains('active');
  document.querySelectorAll('.tool:not(.action)').forEach(t => t.classList.remove('active'));
  if (!was) b.classList.add('active');
  selected = was ? null : b.dataset.hue !== undefined ? { letter: b.textContent, hue: +b.dataset.hue } : b.dataset.tool === 'x' ? { x: true, hue: null } : b.dataset.tool === 'eraser' ? { eraser: true, hue: null } : null;
  hover = null;
  crop.style.cursor = 'default';
  if (img) renderCrop();
}
for (const b of document.querySelectorAll('.tool:not(.action)')) b.addEventListener('click', () => toggleTool(b));

// Pressing a character key selects the matching character button.
document.addEventListener('keydown', e => {
  if (!app.classList.contains('started') || e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.key.length !== 1) return;
  const b = [...document.querySelectorAll('.tool.letter')].find(x => x.textContent === e.key.toUpperCase())
    || (e.key.toLowerCase() === 'x' ? document.querySelector('.tool[data-tool="x"]') : null);
  if (b && !b.disabled) toggleTool(b);
});

let cropScale = 1;        // canvas pixels per image pixel of the right picture (keeps text crisp when enlarged)

// Pinch zoom (mobile, after Start): the picture stays in place and only its content is zoomed/panned.
let view = { z: 1, ox: 0, oy: 0 };   // zoom factor and top-left of the visible part, in crop pixels

function cellAt(e) {
  const [px, py] = pointer(e, crop), x = px / cropScale / view.z + view.ox + rect.x0, y = py / cropScale / view.z + view.oy + rect.y0;
  const c = grid.xs.findIndex((v, i) => i < grid.xs.length - 1 && x >= v && x < grid.xs[i + 1]);
  const r = grid.ys.findIndex((v, i) => i < grid.ys.length - 1 && y >= v && y < grid.ys[i + 1]);
  return c >= 0 && r >= 0 ? { c, r } : null;
}

const touches = new Map();
let pinch = null, pinchLock = false, pinchEnd = 0;
function pinchGeom() {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
crop.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || !app.classList.contains('started')) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) {
    cancelHold(); erasing = false; paintStart = null; painted = false; longFired = false; pinchLock = true;
    const r = crop.getBoundingClientRect(), g = pinchGeom(), k = (rect.x1 - rect.x0) / r.width;
    pinch = { d0: g.d, z0: view.z, px: view.ox + (g.mx - r.left) * k / view.z, py: view.oy + (g.my - r.top) * k / view.z };
  }
  if (pinchLock) e.stopImmediatePropagation();
}, true);
crop.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!pinchLock) return;
  e.stopImmediatePropagation();
  if (!pinch || touches.size < 2) return;
  const r = crop.getBoundingClientRect(), g = pinchGeom(), w = rect.x1 - rect.x0, h = rect.y1 - rect.y0, k = w / r.width;
  const z = Math.min(4, Math.max(1, pinch.z0 * g.d / pinch.d0));
  view = {
    z,
    ox: Math.min(Math.max(0, pinch.px - (g.mx - r.left) * k / z), w - w / z),
    oy: Math.min(Math.max(0, pinch.py - (g.my - r.top) * k / z), h - h / z)
  };
  renderCrop();
}, true);
const endTouch = e => {
  if (!touches.delete(e.pointerId) || !pinchLock) return;
  pinchEnd = performance.now();
  e.stopImmediatePropagation();
  if (touches.size < 2) pinch = null;
  if (!touches.size) pinchLock = false;
};
crop.addEventListener('pointerup', endTouch, true);
crop.addEventListener('pointercancel', endTouch, true);
// A pinch must not end in a tap that toggles a cell.
crop.addEventListener('click', e => {
  if (performance.now() - pinchEnd < 500) { e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
crop.addEventListener('pointermove', e => {
  if (!grid || selected === null || !app.classList.contains('started')) { crop.style.cursor = 'default'; return; }
  let next = cellAt(e);
  if ((e.buttons & 1) && paintStart && !longFired && next && (next.r !== lastPaint.r || next.c !== lastPaint.c)) {
    if (!painted) { paintCell(paintStart); painted = true; }
    paintCell(next);
    lastPaint = next;
    renderCrop();
  }
  if (selected.letter && next && crosses.has(next.r + ',' + next.c)) next = null;
  if (selected.x && next && bigs.has(next.r + ',' + next.c)) next = null;
  if (erasing && next) eraseCell(next);
  if (holding && (!next || next.c !== holding.cell.c || next.r !== holding.cell.r)) cancelHold();
  crop.style.cursor = next ? 'pointer' : 'default';
  if ((next && hover && next.c === hover.c && next.r === hover.r) || (!next && !hover)) return;
  hover = next;
  renderCrop();
});
crop.addEventListener('pointerleave', () => { erasing = false; paintStart = null; cancelHold(); if (hover) { hover = null; renderCrop(); } });

function cancelHold() {
  if (!holding) return;
  cancelAnimationFrame(holding.raf);
  holding = null;
  if (img) renderCrop();
}

function tick() {
  if (!holding) return;
  if (performance.now() - holding.start >= HOLD_MS) {
    const { cell, sel } = holding;
    holding = null; longFired = true;
    commitBig(cell, sel);
    renderCrop();
    return;
  }
  renderCrop();
  holding.raf = requestAnimationFrame(tick);
}

// Places the big letter, clears small letters/big letters in its row and column, and crosses out the other cells there.
function commitBig(cell, sel) {
  for (let r = 0; r < grid.ys.length - 1; r++) for (let c = 0; c < grid.xs.length - 1; c++) {
    if (r !== cell.r && c !== cell.c) continue;
    const key = r + ',' + c;
    marks.delete(key); bigs.delete(key);
    if (r === cell.r && c === cell.c) crosses.delete(key); else crosses.add(key);
  }
  bigs.set(cell.r + ',' + cell.c, sel);
  // Remove this character's small letters everywhere, then lock its button.
  for (const [key, list] of [...marks]) {
    const rest = list.filter(m => m.letter !== sel.letter);
    rest.length ? marks.set(key, rest) : marks.delete(key);
  }
  updateLetterButtons();
}

function updateLetterButtons() {
  const placed = new Set([...bigs.values()].map(m => m.letter));
  highlightLetter = null;
  for (const b of document.querySelectorAll('.tool.letter')) {
    b.disabled = placed.has(b.textContent);
    if (b.disabled) b.classList.remove('active');
  }
  if (selected && selected.letter && placed.has(selected.letter)) selected = null;
}

crop.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !grid || !selected || !selected.letter || !app.classList.contains('started')) return;
  const cell = cellAt(e);
  if (!cell || crosses.has(cell.r + ',' + cell.c)) return;
  cancelHold();
  longFired = false;
  holding = { cell, sel: selected, start: performance.now() + HOLD_DELAY_MS, raf: 0 };
  holding.raf = requestAnimationFrame(tick);
});
crop.addEventListener('pointerup', () => { erasing = false; paintStart = null; cancelHold(); });
crop.addEventListener('pointercancel', () => { erasing = false; cancelHold(); });

// Eraser: clicking (or dragging across) a cell clears X, small letters and big letter.
let erasing = false;

// Dragging with a character or the X tool selected paints that symbol into every cell the pointer enters.
let paintStart = null, lastPaint = null, painted = false;
function paintCell(cell) {
  const key = cell.r + ',' + cell.c;
  if (selected.x) { if (!bigs.has(key)) { crosses.add(key); marks.delete(key); } return; }
  if (crosses.has(key)) return;
  const list = marks.get(key) || [];
  if (!list.some(m => m.letter === selected.letter)) { list.push(selected); marks.set(key, list); }
}
crop.addEventListener('pointerdown', e => {
  painted = false; paintStart = null;
  if (e.button !== 0 || !grid || !selected || !(selected.letter || selected.x) || !app.classList.contains('started')) return;
  paintStart = lastPaint = cellAt(e);
});
function eraseCell(cell) {
  const key = cell.r + ',' + cell.c;
  if (!marks.delete(key) & !crosses.delete(key) & !bigs.delete(key)) return;
  updateLetterButtons();
  renderCrop();
}
crop.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !grid || !selected || !selected.eraser || !app.classList.contains('started')) return;
  const cell = cellAt(e);
  if (!cell) return;
  erasing = true;
  eraseCell(cell);
});


// Right click (or right-drag) places an X, except where a big letter already stands; starting on an X removes X marks instead.
let rightPaint = false, rightRemove = false;
function rightX(e, first) {
  if (!grid || !app.classList.contains('started')) return;
  const cell = cellAt(e);
  if (!cell) return;
  const key = cell.r + ',' + cell.c;
  if (first) rightRemove = crosses.has(key);
  if (rightRemove) { if (crosses.delete(key)) renderCrop(); return; }
  if (bigs.has(key) || crosses.has(key)) return;
  crosses.add(key); marks.delete(key);
  renderCrop();
}
crop.addEventListener('contextmenu', e => e.preventDefault());
crop.addEventListener('pointerdown', e => { if (e.button === 2) { rightPaint = true; rightX(e, true); } });
crop.addEventListener('pointermove', e => { if (rightPaint && (e.buttons & 2)) rightX(e); });
window.addEventListener('pointerup', () => { rightPaint = false; });

    for (const y of grid.ys) { cctx.moveTo(grid.xs[0] - rect.x0, y - rect.y0); cctx.lineTo(grid.xs[grid.xs.length - 1] - rect.x0, y - rect.y0); }

    const gx0 = grid.xs[0] - rect.x0, gy0 = grid.ys[0] - rect.y0, gx1 = grid.xs[grid.xs.length - 1] - rect.x0, gy1 = grid.ys[grid.ys.length - 1] - rect.y0;
    const k = w / (crop.clientWidth || w), hs = Math.max(4, w / 110, COARSE.matches ? 10 * k : 0);
    cctx.fillStyle = '#fff'; cctx.strokeStyle = '#90ee90'; cctx.lineWidth = Math.max(1.5, w / 400);
    for (const [hx, hy] of handles({ x0: gx0, y0: gy0, x1: gx1, y1: gy1 })) {
      cctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 2);
      cctx.strokeRect(hx - hs, hy - hs, hs * 2, hs * 2);
    }
  }
}

// Before Start: resize the grey grid overlay with its handles; the row/column count stays, cells are rescaled.
let gridDrag = null;
function gridHit(e) {
  const [px, py] = pointer(e, crop), x = px / cropScale + rect.x0, y = py / cropScale + rect.y0;
  const o = { x0: grid.xs[0], y0: grid.ys[0], x1: grid.xs[grid.xs.length - 1], y1: grid.ys[grid.ys.length - 1] };
  const tol = Math.max(8, (rect.x1 - rect.x0) / 40, (rect.x1 - rect.x0) / (crop.clientWidth || 1) * (COARSE.matches ? 26 : 10));
  const hs = handles(o);
  for (let i = 0; i < hs.length; i++) if (Math.hypot(x - hs[i][0], y - hs[i][1]) <= tol) return { mode: MODES[i], o, x, y };
  const inX = x >= o.x0 - tol && x <= o.x1 + tol, inY = y >= o.y0 - tol && y <= o.y1 + tol;
  let mode = '';
  if (inX && Math.abs(y - o.y0) <= tol) mode = 'n'; else if (inX && Math.abs(y - o.y1) <= tol) mode = 's';
  if (inY && Math.abs(x - o.x0) <= tol) mode += 'w'; else if (inY && Math.abs(x - o.x1) <= tol) mode += 'e';
  return mode ? { mode, o, x, y } : null;
}
crop.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !grid || app.classList.contains('started')) return;
  const h = gridHit(e);
  if (!h) return;
  gridDrag = { ...h, base: { xs: grid.xs.slice(), ys: grid.ys.slice() } };
  crop.setPointerCapture(e.pointerId);
});
crop.addEventListener('pointermove', e => {
  if (!grid || app.classList.contains('started')) return;
  if (!gridDrag) { const h = gridHit(e); crop.style.cursor = h ? CURSORS[h.mode] : 'default'; return; }
  const [px, py] = pointer(e, crop), dx = px / cropScale + rect.x0 - gridDrag.x, dy = py / cropScale + rect.y0 - gridDrag.y;
  const m = gridDrag.mode, o = gridDrag.o, min = 20;
  let { x0, y0, x1, y1 } = o;
  if (m.includes('w')) x0 = Math.min(Math.max(rect.x0, x0 + dx), x1 - min);
  if (m.includes('e')) x1 = Math.max(Math.min(rect.x1, x1 + dx), x0 + min);
  if (m.includes('n')) y0 = Math.min(Math.max(rect.y0, y0 + dy), y1 - min);
  if (m.includes('s')) y1 = Math.max(Math.min(rect.y1, y1 + dy), y0 + min);
  const { xs, ys } = gridDrag.base;
  grid = { xs: xs.map(v => x0 + (v - o.x0) / (o.x1 - o.x0) * (x1 - x0)), ys: ys.map(v => y0 + (v - o.y0) / (o.y1 - o.y0) * (y1 - y0)) };
  soon(renderCrop);
});
const endGridDrag = () => { if (!gridDrag) return; gridDrag = null; flushSoon(); renderCrop(); };
crop.addEventListener('pointerup', endGridDrag);
crop.addEventListener('pointercancel', endGridDrag);

function drawRect(ctx, r, color, lw, hs) {
  ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.fillStyle = '#fff';
  ctx.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  for (const [hx, hy] of handles(r)) {
    ctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 2);
    ctx.strokeRect(hx - hs, hy - hs, hs * 2, hs * 2);
  }
}

function handles(r) {
  const { x0, y0, x1, y1 } = r, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  return [[x0,y0],[mx,y0],[x1,y0],[x1,my],[x1,y1],[mx,y1],[x0,y1],[x0,my]];
}
const MODES = ['nw','n','ne','e','se','s','sw','w'];

function pointer(e, cv = src) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
}

// Returns {which: 'grid'|'av', mode} for the handle/body under the pointer.
function hit(px, py, only, width = img.width) {
  const big = Math.max(14, width / 40, cssPx(only ? src2 : src, COARSE.matches ? 28 : 14));
  const step2 = app.classList.contains('step2');
  const items = [['av', only || (step2 && !charImg) ? av : null], ['grid', !only && !step2 ? rect : null]].filter(([, r]) => r);
  for (const [which, r] of items) {
    // On small rectangles keep the handle zones small enough to leave room for moving.
    const tol = Math.min(big, Math.max(10, Math.min(r.x1 - r.x0, r.y1 - r.y0) / 3));
    const hs = handles(r);
    let best = -1, bd = tol;
    for (let i = 0; i < hs.length; i++) { const d = Math.hypot(px - hs[i][0], py - hs[i][1]); if (d <= bd) { bd = d; best = i; } }
    if (best >= 0) return { which, mode: MODES[best] };
  }
  for (const [which, r] of items) {
    if (px > r.x0 && px < r.x1 && py > r.y0 && py < r.y1) return { which, mode: 'move' };
  }
  return null;
}

const CURSORS = { nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize', n:'ns-resize', s:'ns-resize', e:'ew-resize', w:'ew-resize', move:'move' };

function dragRect(o, m, dx, dy, W, H) {
  const min = 20;
  let { x0, y0, x1, y1 } = o;
  if (m === 'move') {
    const mx = Math.min(Math.max(dx, -x0), W - x1), my = Math.min(Math.max(dy, -y0), H - y1);
    x0 += mx; x1 += mx; y0 += my; y1 += my;
  } else {
    if (m.includes('w')) x0 = Math.min(Math.max(0, x0 + dx), x1 - min);
    if (m.includes('e')) x1 = Math.max(Math.min(W, x1 + dx), x0 + min);
    if (m.includes('n')) y0 = Math.min(Math.max(0, y0 + dy), y1 - min);
    if (m.includes('s')) y1 = Math.max(Math.min(H, y1 + dy), y0 + min);
  }
  return { x0, y0, x1, y1 };
}

src.addEventListener('pointerdown', e => {
  if (!rect) return;
  const [px, py] = pointer(e), h = hit(px, py);
  if (!h) return;
  if (h.which === 'grid') grid = null;
  drag = { which: h.which, mode: h.mode, px, py, orig: { ...(h.which === 'grid' ? rect : av) } };
  src.setPointerCapture(e.pointerId);
});

src.addEventListener('pointermove', e => {
  const [px, py] = pointer(e);
  if (!drag) { const h = rect && hit(px, py); src.style.cursor = h ? CURSORS[h.mode] : 'default'; return; }
  const r = dragRect(drag.orig, drag.mode, px - drag.px, py - drag.py, img.width, img.height);
  if (drag.which === 'av') av = r; else rect = r;
  const which = drag.which;
  soon(() => render(which));
});

// Characters image: only the cyan rectangle is editable.
let drag2 = null;
src2.addEventListener('pointerdown', e => {
  const [px, py] = pointer(e, src2), h = hit(px, py, 'av', charImg.width);
  if (!h) return;
  drag2 = { mode: h.mode, px, py, orig: { ...av } };
  src2.setPointerCapture(e.pointerId);
});
src2.addEventListener('pointermove', e => {
  if (!charImg) return;
  const [px, py] = pointer(e, src2);
  if (!drag2) { const h = hit(px, py, 'av', charImg.width); src2.style.cursor = h ? CURSORS[h.mode] : 'default'; return; }
  av = dragRect(drag2.orig, drag2.mode, px - drag2.px, py - drag2.py, charImg.width, charImg.height);
  soon(() => render('av'));
});
const endDrag2 = () => { if (!drag2) return; drag2 = null; flushSoon(); render(); };
src2.addEventListener('pointerup', endDrag2);
src2.addEventListener('pointercancel', endDrag2);

function setChars(im) {
  charImg = im;
  src2.width = im.width; src2.height = im.height;
  src2.hidden = false; $('origPane').classList.add('two');
}

$('charFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f || !img) return;
  openFile(f, im => {
    im = limit(im);
    setChars(im);
    av = { x0: 0, y0: 0, x1: im.width, y1: im.height };
    render();
    saveImages();
  });
  e.target.value = '';
});

function endDrag() {
  if (!drag) return;
  const which = drag.which;
  drag = null;
  flushSoon();
  if (which === 'av') render();
  if (which === 'grid') analyze([rect.x0, rect.y0, rect.x1, rect.y1], false);
}
src.addEventListener('pointerup', endDrag);
src.addEventListener('pointercancel', endDrag);

function computeEdges(data, w, h) {
  const px = data.data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];
  const gx = new Float32Array(w * h), gy = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    gx[i] = Math.abs(g[i-w+1] + 2*g[i+1] + g[i+w+1] - g[i-w-1] - 2*g[i-1] - g[i+w-1]);
    gy[i] = Math.abs(g[i+w-1] + 2*g[i+w] + g[i+w+1] - g[i-w-1] - 2*g[i-w] - g[i-w+1]);
  }
  return { gx, gy, g, px, w, h };
}

// box in analysis px: [x0, y0, x1, y1]
function detect(edges, box) {
  const { gx, gy, w, h } = edges;
  let bx0 = Math.max(0, Math.floor(box[0])), by0 = Math.max(0, Math.floor(box[1]));
  let bx1 = Math.min(w, Math.ceil(box[2])), by1 = Math.min(h, Math.ceil(box[3]));
  let xs = null, ys = null;
  // Refine: restrict each axis's profile to the other axis's detected range.
  for (let pass = 0; pass < 3; pass++) {
    const col = new Float32Array(w), row = new Float32Array(h);
    for (let y = by0; y < by1; y++) for (let x = bx0; x < bx1; x++) {
      const i = y * w + x; col[x] += gx[i]; row[y] += gy[i];
    }
    const nx = findChain(col, bx0, bx1), ny = findChain(row, by0, by1);
    if (!nx || !ny) return pass === 0 ? null : { xs, ys };
    xs = nx; ys = ny;
    bx0 = xs[0]; bx1 = xs[xs.length - 1] + 1; by0 = ys[0]; by1 = ys[ys.length - 1] + 1;
  }
  return xs.length >= 3 && ys.length >= 3 ? { xs, ys } : null;
}

function otsu(g, bx0, by0, bx1, by1, w) {
  const hist = new Float64Array(256); let total = 0;
  for (let y = by0; y < by1; y++) for (let x = bx0; x < bx1; x++) { hist[Math.min(255, g[y * w + x] | 0)]++; total++; }
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sB = 0, bestV = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sB += t * hist[t];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > bestV) { bestV = v; thr = t; }
  }
  return thr;
}

function bands(arr, lo, hi, thr) {
  const out = [];
  for (let i = lo; i < hi; i++) {
    if (arr[i] < thr) continue;
    const last = out[out.length - 1];
    if (last && i - last.e <= 2) last.e = i; else out.push({ s: i, e: i });
  }
  return out;
}

// Outermost band, preferring thick ones (the grid's wide black border).
function outerBands(list) {
  if (list.length < 2) return null;
  const th = list.map(b => b.e - b.s + 1).sort((a, b) => a - b), med = th[th.length >> 1];
  const thick = list.filter(b => b.e - b.s + 1 >= 1.5 * med);
  const use = thick.length >= 2 ? thick : list;
  return [use[0], use[use.length - 1]];
}

// Finds the wide dark border (long continuous dark runs), then counts cells inside it.
function detectBorder(edges, box) {
  const { gx, gy, g, w, h } = edges;
  const bx0 = Math.max(0, Math.floor(box[0])), by0 = Math.max(0, Math.floor(box[1]));
  const bx1 = Math.min(w, Math.ceil(box[2])), by1 = Math.min(h, Math.ceil(box[3]));
  if (bx1 - bx0 < 30 || by1 - by0 < 30) return null;
  const thr = otsu(g, bx0, by0, bx1, by1, w);
  const rowRun = new Float32Array(h), colRun = new Float32Array(w), cur = new Float32Array(w);
  for (let y = by0; y < by1; y++) {
    let run = 0;
    for (let x = bx0; x < bx1; x++) {
      if (g[y * w + x] <= thr) {
        run++; cur[x]++;
        if (run > rowRun[y]) rowRun[y] = run;
        if (cur[x] > colRun[x]) colRun[x] = cur[x];
      } else { run = 0; cur[x] = 0; }
    }
  }
  const rMax = Math.max(...rowRun.subarray(by0, by1)), cMax = Math.max(...colRun.subarray(bx0, bx1));
  if (rMax < 0.2 * (bx1 - bx0) || cMax < 0.2 * (by1 - by0)) return null;
  const hb = outerBands(bands(rowRun, by0, by1, 0.6 * rMax));
  const vb = outerBands(bands(colRun, bx0, bx1, 0.6 * cMax));
  if (!hb || !vb) return null;
  const x0 = vb[0].s, x1 = vb[1].e + 1, y0 = hb[0].s, y1 = hb[1].e + 1;
  if (x1 - x0 < 30 || y1 - y0 < 30) return null;

  // Count cells between the border centers using the edge profiles.
  const cxL = (vb[0].s + vb[0].e) >> 1, cxR = (vb[1].s + vb[1].e) >> 1;
  const cyT = (hb[0].s + hb[0].e) >> 1, cyB = (hb[1].s + hb[1].e) >> 1;
  const col = new Float32Array(w), row = new Float32Array(h);
  for (let y = cyT; y <= cyB; y++) for (let x = cxL; x <= cxR; x++) {
    const i = y * w + x; col[x] += gx[i]; row[y] += gy[i];
  }
  const xs = findChain(col, cxL, cxR + 1), ys = findChain(row, cyT, cyB + 1);
  if (!xs || !ys) return null;
  return { xs, ys, rect: [x0, y0, x1, y1] };
}

function boxAvg(a, r) {
  const n = a.length, out = new Float32Array(n), pre = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) pre[i+1] = pre[i] + a[i];
  for (let i = 0; i < n; i++) {
    const lo = Math.max(0, i - r), hi = Math.min(n, i + r + 1);
    out[i] = (pre[hi] - pre[lo]) / (hi - lo);
  }
  return out;
}

// Returns positions of evenly spaced line peaks within [from, to) of a 1D edge profile, or null.
function findChain(full, from, to) {
  const profile = full.subarray(from, to), n = profile.length;
  if (n < 30) return null;
  const sm = boxAvg(profile, 1), bg = boxAvg(profile, 20);
  const hp = new Float32Array(n);
  for (let i = 0; i < n; i++) hp[i] = Math.max(0, sm[i] - bg[i]);
  let mean = 0; for (const v of hp) mean += v; mean /= n;
  let sd = 0; for (const v of hp) sd += (v - mean) ** 2; sd = Math.sqrt(sd / n);
  if (sd === 0) return null;

  // Autocorrelation -> spacing (smallest strong lag, to avoid picking multiples).
  const maxLag = Math.floor(n / 2), ac = new Float32Array(maxLag + 1);
  for (let l = 6; l <= maxLag; l++) {
    let s = 0; for (let i = 0; i + l < n; i++) s += hp[i] * hp[i + l];
    ac[l] = s / (n - l);
  }
  let best = 0; for (let l = 7; l < maxLag; l++) best = Math.max(best, ac[l]);
  if (best <= 0) return null;
  let d = 0;
  for (let l = 7; l < maxLag; l++) {
    if (ac[l] >= 0.6 * best && ac[l] >= ac[l-1] && ac[l] >= ac[l+1]) { d = l; break; }
  }
  if (!d) return null;

  const thr = mean + 0.5 * sd, peaks = [];
  for (let i = 2; i < n - 2; i++) {
    if (hp[i] > thr && hp[i] >= hp[i-1] && hp[i] > hp[i+1] && hp[i] >= hp[i-2] && hp[i] > hp[i+2]) {
      if (peaks.length && i - peaks[peaks.length - 1] < d * 0.4) {
        if (hp[i] > hp[peaks[peaks.length - 1]]) peaks[peaks.length - 1] = i;
      } else peaks.push(i);
    }
  }
  const tol = d * 0.25;
  let bestChain = null, bestFound = 0;
  for (const start of peaks) {
    const chain = [start], found = [true];
    let pos = start;
    for (;;) {
      const exp = pos + d;
      if (exp > n - 1) break;
      const near = peaks.find(p => Math.abs(p - exp) <= tol);
      if (near !== undefined) { pos = near; chain.push(near); found.push(true); }
      else { pos = exp; chain.push(Math.round(exp)); found.push(false); }
      const L = found.length;
      if (L >= 2 && !found[L-1] && !found[L-2]) break;
    }
    while (found.length && !found[found.length - 1]) { chain.pop(); found.pop(); }
    const cnt = found.filter(Boolean).length;
    if (cnt > bestFound) { bestFound = cnt; bestChain = chain; }
  }
  return bestChain && bestChain.length >= 3 && bestFound >= 3 ? bestChain.map(p => p + from) : null;
}
restore();
